<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бесконечный тракт — Tower Defense</title>
<style>
:root{--bg:#f1efe6;--panel:#e2dfd0;--ink:#25302a;--mute:#6b7468;--accent:#2f7d4f;--bad:#b4402f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c211d;--panel:#2a312b;--ink:#e6e8df;--mute:#99a395;--accent:#6cc48b;--bad:#e5705d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c211d;--panel:#2a312b;--ink:#e6e8df;--mute:#99a395;--accent:#6cc48b;--bad:#e5705d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
#top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;font-weight:bold}
#top span{background:var(--panel);padding:4px 12px;border-radius:6px}
#wrap{position:relative;width:100%;max-width:768px}
canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none;background:#3d5a3a}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;font-size:22px;font-weight:bold}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:768px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.sel{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.go{background:var(--accent);color:#fff}
#info{min-height:44px;width:100%;max-width:768px;background:var(--panel);border-radius:6px;padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mute)}
#tree{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;z-index:5}
#tree .th{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc>div{display:flex;flex-direction:column;gap:6px}
.node{text-align:left;font-size:13px}
.node.own{border-color:var(--accent)}
@media(max-width:560px){.tc{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="top"><span>💰 <b id="gold"></b></span><span>❤️ <b id="lives"></b></span><span>Волна <b id="wave"></b></span></div>
<div id="wrap"><canvas id="c" width="768" height="480"></canvas>
<div id="tree"></div>
<div id="over"><div id="overT"></div><button class="go" id="restart">Играть снова</button></div></div>
<div id="bar"></div>
<div id="drop" style="min-height:22px;width:100%;max-width:768px;text-align:center"></div>
<div id="info">Башни падают после каждой волны: чем больше стартов, тем чаще. Выбери башню и кликни по клетке.</div>
<script>
// ===== КОНФИГ — сюда добавляем новые идеи =====
const CELL=48, COLS=16, ROWS=10;
const PATH=[[0,2],[5,2],[5,7],[10,7],[10,3],[15,3]]; // клетки маршрута
const TOWERS={
  arrow:{name:'Стрелок',rarity:'common',cost:50,range:130,dmg:10,rate:2.5,color:'#d9a441',speed:420},
  cannon:{name:'Пушка',rarity:'rare',cost:90,range:110,dmg:30,rate:0.8,color:'#8a5a44',speed:280,splash:50},
  frost:{name:'Мороз',rarity:'common',cost:70,range:100,dmg:4,rate:1.5,color:'#5fb4d9',speed:360,slow:0.5,slowTime:1.5},
  sniper:{name:'Снайпер',rarity:'epic',cost:150,range:280,dmg:90,rate:0.6,color:'#a35fd9',speed:900},
  dragon:{name:'Дракон',rarity:'legendary',cost:400,range:200,dmg:300,rate:2,color:'#ff5a2a',speed:500,splash:90}
};
const ENEMIES={
  basic:{hp:30,speed:60,reward:5,color:'#c0504d',r:11},
  fast:{hp:18,speed:105,reward:4,color:'#e08a3c',r:8},
  tank:{hp:120,speed:38,reward:14,color:'#6a4a8a',r:14}
};
function waveList(n){ // состав волны n — главное место для балансировки
  const l=[];
  for(let i=0;i<5+n*2;i++)l.push('basic');
  if(n>=3)for(let i=0;i<n;i++)l.push('fast');
  if(n>=5)for(let i=0;i<Math.floor(n/2);i++)l.push('tank');
  return l.sort(()=>Math.random()-.5);
}
const hpScale=n=>1+(n-1)*0.18;
// ===== ДРЕВО ЗНАНИЙ: очки за волны, сохраняются после проигрыша =====
const KN={have:{}};
const TREE_COST=60; // цена узла = c × TREE_COST золота
const has=id=>!!KN.have[id];
const dmgMul=()=>1+(has('atk1')?.1:0)+(has('atk4')?.2:0);
const rMul=()=>has('atk3')?1.15:1;
const BRANCH=['Экономика','Атака','Защита'];
const TREE=[ // br — ветка, c — цена, p — требуемый узел
  {id:'eco1',br:0,name:'Трофеи',d:'+25% золота за врагов',c:1,p:null},
  {id:'eco2',br:0,name:'Казна',d:'+50% золота за волну',c:2,p:'eco1'},
  {id:'eco3',br:0,name:'Удача',d:'+30% к шансу дропа башен',c:3,p:'eco2'},
  {id:'atk1',br:1,name:'Заточка',d:'+10% урона',c:1,p:null},
  {id:'atk2',br:1,name:'Скорострельность',d:'+10% скорости стрельбы',c:2,p:'atk1'},
  {id:'atk3',br:1,name:'Меткость',d:'+15% дальности',c:2,p:'atk1'},
  {id:'atk4',br:1,name:'Мастерство',d:'+20% урона',c:4,p:'atk3'},
  {id:'def1',br:2,name:'Крепость',d:'+5 жизней',c:1,p:null},
  {id:'def2',br:2,name:'Болото',d:'враги на 10% медленнее',c:2,p:'def1'},
  {id:'def3',br:2,name:'Припасы',d:'+50 стартового золота',c:2,p:'def2'}
];
function buyNode(id){
  const n=TREE.find(x=>x.id===id);
  if(has(id)||S.gold<n.c*TREE_COST||(n.p&&!has(n.p)))return;
  S.gold-=n.c*TREE_COST;KN.have[id]=true;
  if(id==='def1')S.lives+=5;
  if(id==='def3')S.gold+=50;
  renderTree();
  ui();
}
function toggleTree(){const el=$('tree');el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')renderTree();ui()}
function refreshTree(){
  const g=$('tgold');if(g)g.textContent=S.gold;
  document.querySelectorAll('#tree .node').forEach(b=>{const n=TREE.find(x=>x.id===b.dataset.id);b.disabled=has(n.id)||!!(n.p&&!has(n.p))||S.gold<n.c*TREE_COST});
}
function renderTree(){
  const el=$('tree');el.textContent='';
  const h=document.createElement('div');h.className='th';
  h.innerHTML=`<b>Древо знаний</b><span>Золото: <b id="tgold">${S.gold}</b> 💰</span>`;
  const cb=document.createElement('button');cb.textContent='Закрыть';cb.onclick=toggleTree;h.append(cb);el.append(h);
  const cols=document.createElement('div');cols.className='tc';
  BRANCH.forEach((bn,bi)=>{
    const col=document.createElement('div');col.innerHTML=`<b>${bn}</b>`;
    TREE.filter(n=>n.br===bi).forEach(n=>{
      const b=document.createElement('button'),owned=has(n.id),open=!n.p||has(n.p);
      b.className='node'+(owned?' own':'');b.dataset.id=n.id;b.disabled=owned||!open||S.gold<n.c*TREE_COST;
      b.innerHTML=`<b>${n.name}</b><br><small>${n.d}</small><br><small>${owned?'изучено':open?'цена: '+n.c*TREE_COST+' 💰':'нужно: '+TREE.find(x=>x.id===n.p).name}</small>`;
      b.onclick=()=>buyNode(n.id);col.append(b);
    });
    cols.append(col);
  });
  el.append(cols);
}
// ===== ГАЧА: башни выбиваются, а не покупаются =====
const DROP_CHANCE=0.35; // шанс дропа башни за КАЖДЫЙ старт в конце волны
const RARITY={common:{n:'Обычная',c:'#8d968b'},rare:{n:'Редкая',c:'#4a90d9'},epic:{n:'Эпическая',c:'#a35fd9'},legendary:{n:'Легендарная',c:'#f2a31b'}};
const ODDS=[['legendary',1e-6],['epic',1e-3],['rare',0.08]]; // шансы за одну крутку; остальное — обычные
function pull(){
  const r=Math.random();let acc=0,rar='common';
  for(const [k,p] of ODDS){acc+=p;if(r<acc){rar=k;break}}
  const pool=Object.keys(TOWERS).filter(k=>TOWERS[k].rarity===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}

// ===== СОСТОЯНИЕ =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let S;
const pathCells=new Set(); let paths=[], pathsOk=false, starts=[], end=null;
const MAPT={start:'Кликни по клетке — здесь появятся враги. Стартов может быть несколько, повторный клик убирает старт.',end:'Кликни по клетке — враги идут сюда.',road:'Рисуй дорогу: кликай или веди мышью. Дорога должна соединять старт и финиш.',erase:'Стирает башню (вернётся в инвентарь, поработает и во время волны) или дорогу. Старт и финиш стираются вместе с клеткой.'};
function defaultMap(){
  pathCells.clear();
  for(let i=0;i<PATH.length-1;i++){
    let [x,y]=PATH[i];const [tx,ty]=PATH[i+1];
    while(true){pathCells.add(x+','+y);if(x===tx&&y===ty)break;x+=Math.sign(tx-x);y+=Math.sign(ty-y)}
  }
  starts=[PATH[0].slice()];end=PATH[PATH.length-1].slice();recompute();
}
// поиск кратчайшего пути от старта к финишу по клеткам дороги (BFS)
function recompute(){
  paths=[];pathsOk=false;if(!starts.length||!end)return;
  const key=(x,y)=>x+','+y,prev=new Map([[key(end[0],end[1]),null]]),q=[end];
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){
      const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(pathCells.has(k)&&!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny])}
    }
  }
  for(const s of starts){
    if(!prev.has(key(s[0],s[1])))continue;
    let c=s;const r=[];
    while(c){r.push({x:c[0]*CELL+CELL/2,y:c[1]*CELL+CELL/2});c=prev.get(key(c[0],c[1]))}
    paths.push(r);
  }
  pathsOk=paths.length===starts.length;
}
function applyTool(cx,cy){
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;
  if(S.build==='erase'){const t=S.towers.find(t=>t.cx===cx&&t.cy===cy);if(t){S.gold+=Math.floor(t.spent*.7);S.inv[t.type]=(S.inv[t.type]||0)+1;S.towers=S.towers.filter(x=>x!==t);if(S.sel===t)S.sel=null;ui();return}}
  if(S.waving)return;
  if(S.towers.some(t=>t.cx===cx&&t.cy===cy))return;
  const k=cx+','+cy,m=S.build;
  if(m==='road')pathCells.add(k);
  else if(m==='start'){if(end&&k===end.join(','))return;const i=starts.findIndex(s=>s[0]===cx&&s[1]===cy);if(i>=0)starts.splice(i,1);else{pathCells.add(k);starts.push([cx,cy])}}
  else if(m==='end'){if(starts.some(s=>s[0]===cx&&s[1]===cy))return;pathCells.add(k);end=[cx,cy]}
  else if(m==='erase'){if(end&&k===end.join(','))end=null;const i=starts.findIndex(s=>s[0]===cx&&s[1]===cy);if(i>=0)starts.splice(i,1);pathCells.delete(k)}
  recompute();ui();
}
function reset(){
  const keep=S?{...S.inv}:{arrow:2};if(S)for(const t of S.towers)keep[t.type]=(keep[t.type]||0)+1;
  const dr=S?S.drops:0;
  S={notes:[],inv:keep,drops:dr,gold:100+(has('def3')?50:0),lives:20+(has('def1')?5:0),wave:0,enemies:[],towers:[],shots:[],queue:[],spawnT:0,build:null,sel:null,hover:null,speed:1,over:false,waving:false};
  $('over').style.display='none';ui();
}
function ui(){
  $('gold').textContent=S.gold;$('lives').textContent=S.lives;$('wave').textContent=S.wave;
  document.querySelectorAll('#bar button[data-t]').forEach(b=>{const k=b.dataset.t,n=S.inv[k]||0;b.classList.toggle('sel',S.build===k);b.disabled=n<1&&S.build!==k;b.textContent=`${TOWERS[k].name} ×${n}`});
  
  document.querySelectorAll('#bar button[data-m]').forEach(b=>{b.classList.toggle('sel',S.build===b.dataset.m);b.disabled=S.waving&&b.dataset.m!=='erase'});
  $('treeBtn').textContent='🌳 Древо знаний';if($('tree').style.display==='block')refreshTree();
  $('next').disabled=S.waving||S.over||!pathsOk;
  $('spd').textContent='Скорость ×'+S.speed;
  const info=$('info');
  if(S.sel){
    const t=S.sel,up=upCost(t);
    info.innerHTML=`<b style="color:var(--ink)">${TOWERS[t.type].name} ур.${t.lvl}</b> урон ${t.dmg.toFixed(0)}, дальность ${t.range.toFixed(0)} `;
    const u=document.createElement('button');u.textContent=`Улучшить (${up})`;u.disabled=S.gold<up||t.lvl>=5;u.onclick=()=>{if(S.gold>=up){S.gold-=up;t.lvl++;t.dmg*=1.35;t.range*=1.08;t.spent+=up;ui()}};
    const s=document.createElement('button');s.textContent=`Забрать в инвентарь (+${Math.floor(t.spent*.7)})`;s.onclick=()=>{S.gold+=Math.floor(t.spent*.7);S.inv[t.type]=(S.inv[t.type]||0)+1;S.towers=S.towers.filter(x=>x!==t);S.sel=null;ui()};
    info.append(u,s);
  } else if(MAPT[S.build]){info.textContent=MAPT[S.build]}
  else if(S.build){const d=TOWERS[S.build];info.textContent=`${d.name} (${RARITY[d.rarity].n}): урон ${d.dmg}, дальность ${d.range}${d.splash?', по площади':''}${d.slow?', замедляет':''}`}
  else info.textContent=pathsOk?'Башни падают после каждой волны: чем больше стартов, тем чаще. Выбери башню и кликни по клетке.':(!end?'Поставь финиш.':starts.length?'Не все старты соединены с финишем — соедини их дорогой.':'Поставь хотя бы один старт.');
}
const upCost=t=>Math.round(TOWERS[t.type].cost*0.7*t.lvl);

// ===== UI-кнопки =====
const bar=$('bar');
for(const k in TOWERS){const b=document.createElement('button');b.dataset.t=k;b.style.borderBottomColor=RARITY[TOWERS[k].rarity].c;
  b.onclick=()=>{S.build=S.build===k?null:k;S.sel=null;ui()};bar.append(b)}
function showDrop(list){
  const tally={};
  for(const k of list){S.inv[k]=(S.inv[k]||0)+1;S.drops++;tally[k]=(tally[k]||0)+1}
  const el=$('drop');el.textContent='';
  for(const k in tally){const t=TOWERS[k],r=RARITY[t.rarity],s=document.createElement('b');
    s.textContent=(t.rarity==='legendary'?'🌟 ':'')+t.name+(tally[k]>1?' ×'+tally[k]:'');s.style.cssText='color:'+r.c+';margin-right:10px';el.append(s)}
  const c=document.createElement('span');c.style.color='var(--mute)';c.textContent='выпало всего: '+S.drops;el.append(c);
  ui();
}

for(const [k,n] of [['start','Старт'],['end','Финиш'],['road','Дорога'],['erase','Стереть']]){const b=document.createElement('button');b.dataset.m=k;b.textContent='🛠 '+n;
  b.onclick=()=>{S.build=S.build===k?null:k;S.sel=null;ui()};bar.append(b)}
const tb=document.createElement('button');tb.id='treeBtn';tb.onclick=toggleTree;bar.append(tb);
const nb=document.createElement('button');nb.id='next';nb.className='go';nb.textContent='Следующая волна';
nb.onclick=()=>{if(S.waving||S.over||!pathsOk)return;S.build=MAPT[S.build]&&S.build!=='erase'?null:S.build;S.wave++;S.queue=waveList(S.wave);S.spawnT=0;S.waving=true;ui()};bar.append(nb);
const sp=document.createElement('button');sp.id='spd';sp.onclick=()=>{S.speed=S.speed===1?2:S.speed===2?3:1;ui()};bar.append(sp);
$('restart').onclick=reset;
addEventListener('keydown',e=>{if(e.key==='Escape'){S.build=null;S.sel=null;ui()}});

// ===== ВВОД =====
function cellAt(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;return{cx:Math.floor(x/CELL),cy:Math.floor(y/CELL)}}
let painting=false;
cv.addEventListener('pointermove',e=>{S.hover=cellAt(e);if(painting&&(S.build==='road'||S.build==='erase'))applyTool(S.hover.cx,S.hover.cy)});
cv.addEventListener('pointerleave',()=>{S.hover=null;painting=false});
addEventListener('pointerup',()=>painting=false);
cv.addEventListener('pointerdown',e=>{
  if(S.over)return;
  const {cx,cy}=cellAt(e);S.hover={cx,cy};
  if(MAPT[S.build]){painting=true;applyTool(cx,cy);return}
  const ex=S.towers.find(t=>t.cx===cx&&t.cy===cy);
  if(ex){S.sel=ex;S.build=null;ui();return}
  if(S.build&&!pathCells.has(cx+','+cy)&&cx>=0&&cy>=0&&cx<COLS&&cy<ROWS){
    const d=TOWERS[S.build];
    if((S.inv[S.build]||0)>0){
      S.inv[S.build]--;
      S.towers.push({type:S.build,cx,cy,x:cx*CELL+CELL/2,y:cy*CELL+CELL/2,lvl:1,dmg:d.dmg,range:d.range,cd:0,spent:0});
      if(!S.inv[S.build])S.build=null;
      ui();
    }
  } else {S.sel=null;ui()}
});

// ===== ЛОГИКА =====
function spawn(type){
  const d=ENEMIES[type],h=d.hp*hpScale(S.wave);
  for(const p of paths)S.enemies.push({type,hp:h,max:h,pts:p,x:p[0].x,y:p[0].y,wp:0,slow:0,dead:false});
}
function update(dt){
  for(const n of S.notes)n.t+=dt;S.notes=S.notes.filter(n=>n.t<3.5);
  if(S.over)return;
  if(S.queue.length){S.spawnT-=dt;if(S.spawnT<=0){spawn(S.queue.pop());S.spawnT=Math.max(.35,.9-S.wave*.03)}}
  for(const e of S.enemies){
    const d=ENEMIES[e.type];e.slow=Math.max(0,e.slow-dt);
    let mv=d.speed*(has('def2')?.9:1)*(e.slow>0?e.slowF:1)*dt;
    while(mv>0&&e.wp<e.pts.length){
      const p=e.pts[e.wp],dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);
      if(dist<=mv){e.x=p.x;e.y=p.y;e.wp++;mv-=dist}
      else{e.x+=dx/dist*mv;e.y+=dy/dist*mv;mv=0}
    }
    if(e.wp>=e.pts.length){e.dead=true;S.lives--;if(S.lives<=0)gameOver(false)}
  }
  for(const t of S.towers){
    t.cd-=dt;if(t.cd>0)continue;
    const d=TOWERS[t.type];let best=null,bp=-1;
    for(const e of S.enemies){if(e.dead)continue;
      if(Math.hypot(e.x-t.x,e.y-t.y)<=t.range*rMul()){const pr=e.wp*1e4-Math.hypot(e.pts[Math.min(e.wp,e.pts.length-1)].x-e.x,e.pts[Math.min(e.wp,e.pts.length-1)].y-e.y);if(pr>bp){bp=pr;best=e}}}
    if(best){t.cd=1/(d.rate*(has('atk2')?1.1:1));S.shots.push({x:t.x,y:t.y,target:best,t});}
  }
  for(const s of S.shots){
    const d=TOWERS[s.t.type];
    if(s.target.dead){s.gone=true;continue}
    const dx=s.target.x-s.x,dy=s.target.y-s.y,dist=Math.hypot(dx,dy),step=d.speed*dt;
    if(dist<=step){hit(s,d);s.gone=true}else{s.x+=dx/dist*step;s.y+=dy/dist*step}
  }
  S.shots=S.shots.filter(s=>!s.gone);
  for(const e of S.enemies)if(!e.dead&&e.hp<=0){e.dead=true;S.gold+=Math.round(ENEMIES[e.type].reward*(has('eco1')?1.25:1));ui()}
  S.enemies=S.enemies.filter(e=>!e.dead);
  if(S.waving&&!S.queue.length&&!S.enemies.length){
    S.waving=false;S.gold+=Math.round((20+S.wave*3)*(has('eco2')?1.5:1));
    const got=[];for(const s of starts)if(Math.random()<DROP_CHANCE*(has('eco3')?1.3:1)){const k=pull();got.push(k);S.notes.push({x:s[0]*CELL+CELL/2,y:s[1]*CELL,k,t:0})}
    if(got.length)showDrop(got);else $('drop').textContent='Башни не выпали. Больше стартов — выше шанс.';
    ui();
  }
}
function hit(s,d){
  const hurt=e=>{e.hp-=s.t.dmg*dmgMul();if(d.slow){e.slow=d.slowTime;e.slowF=d.slow}};
  if(d.splash){for(const e of S.enemies)if(!e.dead&&Math.hypot(e.x-s.target.x,e.y-s.target.y)<=d.splash)hurt(e);s.boom={x:s.target.x,y:s.target.y,r:d.splash}}
  else hurt(s.target);
}
function gameOver(win){S.over=true;$('overT').textContent=win?'Победа! 🎉':'Поражение';$('over').style.display='flex'}

// ===== ОТРИСОВКА =====
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke()}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke()}
  ctx.fillStyle='#b99a6b';
  pathCells.forEach(k=>{const [x,y]=k.split(',').map(Number);ctx.fillRect(x*CELL,y*CELL,CELL,CELL)});
  starts.forEach(s=>marker(s,'#3a9a5a','С'));marker(end,'#c0453a','Ф');
  for(const t of S.towers){
    const d=TOWERS[t.type];
    ctx.fillStyle='#444';ctx.fillRect(t.cx*CELL+6,t.cy*CELL+6,CELL-12,CELL-12);
    ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(t.x,t.y,14,0,7);ctx.fill();
    ctx.fillStyle='#fff';for(let i=0;i<t.lvl;i++)ctx.fillRect(t.cx*CELL+8+i*7,t.cy*CELL+CELL-10,5,4);
  }
  for(const e of S.enemies){
    const d=ENEMIES[e.type];
    ctx.fillStyle=e.slow>0?'#7fc4e0':d.color;ctx.beginPath();ctx.arc(e.x,e.y,d.r,0,7);ctx.fill();
    ctx.fillStyle='#000a';ctx.fillRect(e.x-12,e.y-d.r-7,24,4);
    ctx.fillStyle='#5c5';ctx.fillRect(e.x-12,e.y-d.r-7,24*Math.max(0,e.hp/e.max),4);
  }
  for(const s of S.shots){ctx.fillStyle=TOWERS[s.t.type].color;ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();
    if(s.boom){ctx.strokeStyle='#fa4';ctx.beginPath();ctx.arc(s.boom.x,s.boom.y,s.boom.r,0,7);ctx.stroke()}}
  // подсветка и радиус
  const h=S.hover;
  if(h&&S.build&&TOWERS[S.build]&&h.cx>=0&&h.cy>=0&&h.cx<COLS&&h.cy<ROWS){
    const ok=!pathCells.has(h.cx+','+h.cy)&&!S.towers.some(t=>t.cx===h.cx&&t.cy===h.cy);
    ctx.fillStyle=ok?'rgba(255,255,255,.25)':'rgba(220,60,40,.4)';ctx.fillRect(h.cx*CELL,h.cy*CELL,CELL,CELL);
    ring(h.cx*CELL+CELL/2,h.cy*CELL+CELL/2,TOWERS[S.build].range*rMul());
  }
  if(h&&MAPT[S.build]){ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(h.cx*CELL,h.cy*CELL,CELL,CELL)}
  if(S.sel)ring(S.sel.x,S.sel.y,S.sel.range*rMul());
  // уведомления о дропе над стартом
  for(const n of S.notes){
    const t=TOWERS[n.k],r=RARITY[t.rarity],txt=(t.rarity==='legendary'?'🌟 ':'')+'+ '+t.name;
    ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(txt).width+16,x=Math.max(w/2+2,Math.min(cv.width-w/2-2,n.x)),y=Math.max(16,n.y-16-n.t*12);
    ctx.globalAlpha=Math.max(0,Math.min(1,(3.5-n.t)/.8));
    ctx.fillStyle='rgba(20,24,20,.88)';ctx.fillRect(x-w/2,y-12,w,24);
    ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.strokeRect(x-w/2,y-12,w,24);
    ctx.fillStyle=r.c;ctx.fillText(txt,x,y+1);
    ctx.globalAlpha=1;ctx.lineWidth=1;
  }
}
function marker(p,col,t){if(!p)return;const x=p[0]*CELL+CELL/2,y=p[1]*CELL+CELL/2;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y+1)}
function ring(x,y,r){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.setLineDash([])}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=0;i<S.speed;i++)update(dt);
  draw();requestAnimationFrame(loop);
}
defaultMap();reset();requestAnimationFrame(loop);
</script>
